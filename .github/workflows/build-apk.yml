name: Build APK Tanpa Gradlew
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Pasang Gradle 8.7 stabil
        run: |
          sudo apt update && sudo apt install -y wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          gradle -v

      - name: Tambahkan namespace ke build.gradle
        run: |
          echo "android { namespace 'com.maden77.imagetoconicontool' }" >> app/build.gradle

      - name: Build APK Debug
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToIconTool-APK
          path: app/build/outputs/apk/debug/*.apk
